function finishDay(){if(!session||!session.active)return;stopPour();stopBeer();clearInterval(window.patienceTimer);session.active=false;let rent=[7,14,28,50,85][0];state.coins=Math.max(0,state.coins-rent);if(activeBottle){let empty=state.savedBottles.findIndex((x,i)=>i<state.slots&&!x);if(empty>=0)state.savedBottles[empty]=activeBottle;activeBottle=null}let reviews=session.ratings.filter(x=>x.finalized),average=reviews.length?reviews.reduce((s,x)=>s+x.finalStars,0)/reviews.length:0;let earn=session.income+session.tip-session.cost-(session.decorCost||0)-rent;state.history.push({day:session.day,average,count:reviews.length,profit:earn});if(session.day>=state.unlocked&&session.done>0)state.unlocked=Math.min(10,session.day+1);state.day=state.unlocked;persist();view='summary';modalOpen(`<h2>📊 第${session.day}天 · 营业日报</h2><div class="row"><span>今日顾客</span><b>${session.done} / ${session.total}</b></div><div class="row"><span>有效评价</span><b>${reviews.length} 条</b></div><div class="row"><span>今日平均评分</span><b>${average.toFixed(2)} ★</b></div><div class="row"><span>今日历史最高</span><b>${(dailyBest().get(session.day)||0).toFixed(2)} ★</b></div><div class="row"><span>店铺总评分（按每日最佳）</span><b>${ratingLabel()} ★</b></div><div class="row"><span>客流量加成</span><b>${Math.round(trafficModifier()*100)}%</b></div><div class="row"><span>饮品收入</span><b>+${money(session.income)}</b></div><div class="row"><span>小费</span><b>+${money(session.tip)}</b></div><div class="row"><span>本日新取酒瓶</span><b>−${money(session.cost)}</b></div><div class="row"><span>装饰品花费（不影响评分）</span><b>−${money(session.decorCost||0)}</b></div><div class="row"><span>房租+水电</span><b>−${rent}</b></div><div class="row"><span>本日净利润</span><b>${earn>=0?'+':''}${money(earn)}</b></div><div class="row"><span>现有金币</span><b>${money(state.coins)}</b></div><p>已解锁到第 ${state.unlocked} 天；重玩当日可以刷新最高评分，订单随机生成。</p><div class="actions"><button class="btn" id="home">返回主页</button><button class="btn yellow" id="nextDayBtn">下一日</button></div>`);$('home').onclick
