function calculateRating(r){let target=Object.entries(r.parts);let intended=target.reduce((s,[id,v])=>s+v,0);let diff=target.reduce((s,[id,v])=>s+Math.abs((glass.parts[id]||0)-v),0);for(let [id,v]of Object.entries(glass.parts))if(r.parts[id]===undefined)diff+=v;let err=diff/Math.max(1,intended)*100;err+=Math.abs((glass.extras.ice||0)-r.ice)*10;if(r.tool&&r.tool!==glass.tool)err+=10;const recommended=r.kind==='beer'?2:r.id===7||r.id===8||r.id===9?5:r.id===5||r.id===6?3:0;let idx=GLASSES.findIndex(g=>g[0]===glass.name);if(idx!==recommended)err+=15;if(r.kind==='beer'){const foamPercent=(glass.foam||0)*100;if(foamPercent>30)err+=Math.min(40,(foamPercent-30)*2)}if(glass.overflow)err+=Math.min(40,glass.overflow/Math.max(1,intended)*100);err=Math.min(100,err);let stars=err<=10?5:err<=20?4:err<=30?3:err<=40?2:1;return {err,stars}}
function deliver(i){if(!glass){showToast('先制作饮品');return}let c=session.customers[i];if(!c){showToast('这里没有顾客');return}if(!Object.keys(glass.parts).length){showToast('这还是空杯');return}stopPour();stopBeer();let r=R[c.recipe],result=calculateRating(r),stars=result.stars,paid=money(r.price*([0,.4,.6,.8,1,1][stars])),tip=stars===5?money(r.price*.2):stars===4?money(r.price*Math.random()*.2):0;glass=null;session.done++;session.income+=paid;session.tip+=tip;state.coins+=paid+tip;session.ratings.push({name:c.name,recipe:r.name,stars,finalStars:stars,paid,tip,err:result.err});let record=session.ratings[session.ratings.length-1];persist();session.customers[i]=null;fillSeat(i);selectedSeat=session.customers.findIndex(x=>x);if(selectedSeat<0)selectedSeat=0;renderGame();const compensation=stars<=2;modalOpen(`<h2>${'★'.repeat(stars)}${'☆'.repeat(5-stars)} · 顾客评价</h2><p><b>${c.name}</b>：${r.name}</p><div class="row"><span>配方综合误差</span><b>${result.err.toFixed(1)}%</b></div><div class="row"><span>实收饮品金额</span><b>${paid}金币</b></div><div class="row"><span>小费</span><b>${tip}金币</b></div>${compensation?'<p>顾客对饮品不满意。你可以选择免单协商改善评价，但有失败概率。</p>':''}<div class="actions">${compensation?'<button class="btn" id="free">免单协商</button>':''}<button class="btn yellow" id="accept">${compensation?'正常收费':'继续接待'}</button></div>`);$('accept').onclick=()=>{finalizeRating(record,false);modalClose();if(session.done>=session.total)finishDay()};if(compensation)$('free').onclick=()=>{session.income-=record.paid;state.coins-=record.paid;record.paid=0;let chance={随和:.85,普通:.7,理性:.65,挑剔:.5,急性子:.55}[c.personality]||.7;let ok=Math.random()<chance;record.finalStars=ok?Math.min(5,record.stars+1+Math.floor(Math.random()*3)):record.stars;record.compensated=true;modalOpen(`<h2>${ok?'协商成功':'协商失败'}</h2><p>本次饮品已免单，收入 0金币。</p><p>顾客最终评价：<b>${'★'.repeat(record.finalStars)}${'☆'.repeat(5-record.finalStars)}</b></p><div class="actions"><button class="btn yellow" id="nextCust">继续营业</button></div>`);$('nextCust').onclick=()=>{finalizeRating(record,true);modalClose();if(session.done>=session.total)finishDay()}}}
function finalizeRating(record,free){if(record.finalized)return;record.finalized=true;state.ratingSum+=record.finalStars;state.ratingCount++;persist();if(view==='game')updateCustomers()}
function finishDay(){if(!session||!session.active)return;stopPour();stopBeer();clearInterval(window.patienceTimer);session.active=false;let rent=[7,14,28,50,85][0];state.coins=Math.max(0,state.coins-rent);if(activeBottle){let empty=state.savedBottles.findIndex((x,i)=>i<state.slots&&!x);if(empty>=0)state.savedBottles[empty]=activeBottle;activeBottle=null}let reviews=session.ratings.filter(x=>x.finalized),average=reviews.length?reviews.reduce((s,x)=>s+x.finalStars,0)/reviews.length:0;let earn=session.income+session.tip-session.cost-(session.decorCost||0)-rent;state.history.push({day:session.day,average,count:reviews.length,profit:earn});if(session.day>=state.unlocked&&session.done>0)state.unlocked=Math.min(10,session.day+1);state.day=state.unlocked;persist();view='summary';modalOpen(`<h2>📊 第${session.day}天 · 营业日报</h2><div class="row"><span>今日顾客</span><b>${session.done} / ${session.total}</b></div><div class="row"><span>有效评价</span><b>${reviews.length} 条</b></div><div class="row"><span>今日平均评分</span><b>${average.toFixed(2)} ★</b></div><div class="row"><span>累计店铺评分</span><b>${state.ratingCount?(state.ratingSum/state.ratingCount).toFixed(2):'—'} ★</b></div><div class="row"><span>饮品收入</span><b>+${money(session.income)}</b></div><div class="row"><span>小费</span><b>+${money(session.tip)}</b></div><div class="row"><span>本日新取酒瓶</span><b>−${money(session.cost)}</b></div><div class="row"><span>装饰品花费（不影响评分）</span><b>−${money(session.decorCost||0)}</b></div><div class="row"><span>房租+水电</span><b>−${rent}</b></div><div class="row"><span>本日净利润</span><b>${earn>=0?'+':''}${money(earn)}</b></div><div class="row"><span>现有金币</span><b>${money(state.coins)}</b></div><p>已解锁到第 ${state.unlocked} 天。旧日可反复游玩且订单随机。</p><div class="actions"><button class="btn" id="home">返回主页</button><button class="btn yellow" id="next">下一日</button></div>`);$('home').onclick=()=>{modalClose();session=null;renderHome()};$('next').onclick=()=>{modalClose();begin(state.unlocked)}}
window.addEventListener('pointerup',()=>{if(!tapPourMode){pourPointerActive=false;stopPour()}});window.addEventListener('pointercancel',()=>{if(!tapPourMode){pourPointerActive=false;stopPour()}});window.addEventListener('touchend',()=>{if(!tapPourMode){pourPointerActive=false;stopPour()}});window.addEventListener('touchcancel',()=>{if(!tapPourMode){pourPointerActive=false;stopPour()}});renderHome();window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden){stopPour();stopBeer();persist()}});
