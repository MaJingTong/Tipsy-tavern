/* V0.5 – warm pixel inspired compact cabinet / enlarged mixing space */
:root{--bg:#2b2025;--panel:#423036;--p2:#5b4140;--gold:#f2ba60;--cream:#fff0d5;--red:#ac7162}
#app{max-width:620px;gap:6px;padding-left:7px;padding-right:7px;background:linear-gradient(180deg,#3a282c,#251a24)}
.panel{border-color:#967259;background:linear-gradient(160deg,#49363a,#38282f);box-shadow:inset 0 1px 0 #ffffff14}
.shelf{min-height:67px;padding:5px;gap:5px;flex:0 0 auto;border-color:#ad805a}
.shelfControls{width:43px;gap:3px}.switch{padding:1px;font-size:11px;border-radius:5px}
.shelfItems{gap:3px}.tile{padding:1px;gap:1px;min-height:57px;background:#59403b;border-color:#80604c}.tile .emoji{font-size:20px}.tile small{font-size:9px}
.arrows{width:29px;gap:3px}.arrows button{border-radius:5px}
.workspace{grid-template-columns:minmax(91px,25%) minmax(0,1fr);gap:6px;min-height:410px;flex:1}
.space{padding:6px;gap:5px;border-color:#a17a60;background:linear-gradient(#6b4b3d,#483437)}
.space h3{font-size:12px;letter-spacing:.1px}
.sideSlots{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-content:start}
.slot{min-height:66px;padding:2px 1px;border-radius:5px;background:#634b47}.slot .sym{font-size:19px}.slot small{font-size:9px;line-height:1.15}
.main{background:linear-gradient(180deg,#755442,#4d3432);border-color:#d1a471}
.main .canvas{min-height:270px;background:linear-gradient(180deg,#4d3432 0%,#6b4838 73%,#946544 74%,#b07a4c 100%);border:1px dashed #d1a26a;gap:4px}
.glass{width:clamp(100px,24vw,138px);height:clamp(165px,28vh,240px);border-width:4px;flex-shrink:0}
.garnishUmbrella{position:absolute;right:-2px;top:0;z-index:5;font-size:24px}.garnishLemon{position:absolute;right:2px;top:28px;z-index:5;font-size:19px}.garnishSalt{position:absolute;top:0;left:15%;right:15%;font-size:14px;color:#fff;z-index:4}
.coasterVisual{font-size:10px;background:#59412e;border-radius:15px;padding:1px 8px;color:#efc78e}
.bottleMain{font-size:11px;padding:6px 3px}.bottleMain span{font-size:17px}
.pour{min-height:61px;font-size:16px;padding:9px 2px}.upgrade{padding:6px 2px;font-size:10px}
.lower{padding:5px}.tabs{margin-bottom:4px;gap:4px}.tabs button{padding:5px 9px;font-size:12px}
.ingredients{grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.ingredient{min-height:52px;padding:2px;gap:1px}.ingredient span{font-size:19px}.ingredient small{font-size:9px}.decorPrice{color:#f6cf78;font-size:9px!important}
.footer button{padding:9px 3px}.hint{font-size:10px}
@media(max-width:390px){.workspace{grid-template-columns:minmax(84px,25%) minmax(0,1fr)}.space{padding:4px}.main .canvas{min-height:250px}.glass{width:102px;height:170px}.slot{min-height:60px}.ingredient{min-height:49px}}
@media(max-height:750px){.workspace{min-height:340px}.main .canvas{min-height:210px}.glass{height:155px;width:100px}}

/* V0.8: purchasable persistent recipe note on left edge of the main workbench */
.modal button:disabled{opacity:.4;filter:grayscale(1);cursor:not-allowed;background:#736969!important;color:#e0d9d5!important;border-color:#8a7b79!important}
.main .canvas{isolation:isolate}
.pinnedNote{position:absolute;z-index:9;top:10px;left:5px;max-width:39%;max-height:70%;overflow:auto;text-align:left;display:flex;flex-direction:column;gap:5px;background:#fff0b9;color:#5a3826;border:2px solid #c18e47;box-shadow:2px 4px 0 #35251b70;transform:rotate(-1deg);padding:7px 5px;border-radius:3px;font-size:10px;line-height:1.45;overflow-wrap:anywhere;touch-action:manipulation}
.pinnedNote strong{font-size:11px}.pinnedNote span{white-space:normal}
@media(max-width:390px){.pinnedNote{max-width:42%;padding:5px 4px;font-size:9px}.pinnedNote strong{font-size:10px}}

/* V0.5: visibly distinct glass bodies and animated ingredient effects */
.glass{transform-origin:center bottom;flex-shrink:0;transition:background .2s;}
.glass.shape-highball{width:90px;height:156px;border-radius:8px 8px 13px 13px}
.glass.shape-rocks{width:122px;height:115px;border-radius:12px 12px 22px 22px;border-width:5px}
.glass.shape-beer{width:104px;height:161px;border-radius:9px 9px 16px 16px;border-width:6px;box-shadow:12px 4px 0 -6px #d5eaff7c}
.glass.shape-wine{width:98px;height:145px;border-radius:33% 33% 42% 42% / 14% 14% 54% 54%;clip-path:polygon(0 0,100% 0,89% 66%,63% 82%,63% 92%,85% 96%,85% 100%,15% 100%,15% 96%,37% 92%,37% 82%,11% 66%)}
.glass.shape-cocktail{width:142px;height:139px;clip-path:polygon(0 0,100% 0,55% 65%,55% 92%,72% 97%,72% 100%,28% 100%,28% 97%,45% 92%,45% 65%);border-radius:3px}
.glass.shape-shot{width:65px;height:82px;border-radius:9px 9px 12px 12px}
.tint{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;}
.tint-pop{animation:tint-in .28s ease-out}
.floatingIngredient{position:absolute;z-index:4;font-size:21px;pointer-events:none;animation:ingredient-drop .45s ease-out both}
.lemonBit{bottom:24%;right:10%}.mintBit{bottom:42%;left:12%}.cherryBit{bottom:17%;left:15%}.limeBit{bottom:57%;right:12%}.syrupBit{bottom:34%;left:40%;font-size:14px}
@keyframes ingredient-drop{from{transform:translateY(-40px) rotate(-20deg);opacity:.1}to{transform:translateY(0) rotate(0);opacity:1}}
@keyframes tint-in{from{opacity:0}to{opacity:1}}
.pour{min-height:78px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dayGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dayCard{position:relative;min-height:85px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}.dayCard small{font-size:11px;color:#ffe0a3}.newDay{position:absolute;right:3px;top:2px;font-size:10px;border-radius:6px;background:#f2b854;color:#35231d;padding:2px 5px}.candyBowl{text-align:center;margin:5px 0;font-size:12px;color:#ffe1a7;padding:4px;border-radius:7px;background:#644a47;border:1px solid #896965} 
/* V0.9: left storage cabinet has a stable bottom edge and never stretches with the main mixing area. */
.workspace{align-items:stretch}
#sideArea{height:420px;min-height:420px;align-self:start;flex:none}
#sideArea .sideSlots{flex:none;grid-template-rows:repeat(4,1fr);height:340px;min-height:0;align-content:stretch}
#sideArea .slot{min-height:0;height:100%;overflow:hidden}
#sideArea .upgrade{margin-top:auto;flex:0 0 auto}
.shopSectionTitle{font-size:15px;color:#f8d393;margin:18px 0 8px;border-top:1px solid #70545c;padding-top:14px}
.ingredient.decorLocked{opacity:.45;filter:grayscale(.7);cursor:not-allowed}
@media(max-height:750px){#sideArea{height:370px;min-height:370px}#sideArea .sideSlots{height:293px}}
@media(max-width:390px){#sideArea{height:390px;min-height:390px}#sideArea .sideSlots{height:312px}}

/* V0.9.1 mobile recovery safeguards */
.mobileError{border:1px solid #e9b35c;background:#55343e;border-radius:8px;padding:8px;font-size:12px;color:#ffe2bd;text-align:center}
#sideArea{min-width:0;overflow:hidden}
#sideArea .sideSlots{min-width:0;overflow:auto}
@supports(height:100dvh){#app{min-height:100dvh}}

.homeTitle{text-align:center;font-size:clamp(34px,9vw,55px);font-weight:900;color:#ffefc1;letter-spacing:3px;text-shadow:3px 4px #733b30,-2px -2px #b5743f,0 0 15px #b94d28;line-height:1.12;filter:drop-shadow(0 3px 0 #2a151d)}
.homeTitle:before,.homeTitle:after{content:'✦';font-size:17px;color:#fbd16c;vertical-align:middle;margin:0 8px;animation:twinkle 3s ease-in-out infinite alternate}
.homeLabel{font-size:10px;letter-spacing:3px;color:#ffe6b2;text-align:center;text-shadow:0 2px 3px #311821;margin-top:-5px}
.homeStats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pixelCard{background:linear-gradient(155deg,#613936ed,#2d202be8);border:2px solid #edb46a;border-radius:10px;box-shadow:0 3px 0 #261820, inset 0 0 0 2px #875343;color:#ffe6bd;text-shadow:0 1px #2d1c1c;padding:10px 8px;text-align:center;font-weight:700;font-size:12px}
.pixelCard strong{color:#ffe891;font-size:17px}
.dayPanel{border:2px solid #e1a76d;border-radius:10px;background:#ffebd6ec;color:#6a3529;box-shadow:0 3px #3c2220,inset 0 0 0 2px #fffaf0;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayPanel strong{font-size:18px}.dayPanel small{display:block;font-size:10px;margin-top:3px;color:#885845}.dayPanel .badgeStar{font-size:12px;font-weight:700;white-space:nowrap;color:#a56535}
.homeAtmosphere{min-height:135px;pointer-events:none;position:relative}
.homeAtmosphere .homeSpark{position:absolute;right:17%;top:3%;font-size:22px;color:#ffe98a;animation:twinkle 2s infinite alternate;filter:drop-shadow(0 0 5px #ffc86d)}
.homePrimary{border:4px solid #fff3b7;outline:3px solid #7f3c2b;background:linear-gradient(#fff5a7,#ffd261 45%,#e8993a);color:#65331f;text-shadow:0 1px #fff5bb;font-size:clamp(21px,5.5vw,30px);font-weight:900;letter-spacing:2px;border-radius:16px;padding:14px 8px;box-shadow:0 6px 0 #a14a24,0 10px 0 #39201f,0 0 21px #ffc65e66;min-height:67px}
.homeNav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.homeNav.bottom{grid-template-columns:repeat(3,minmax(0,1fr))}
.homeBtn{border:2px solid #f5b98a;border-radius:10px;background:linear-gradient(155deg,#a86155,#713b48);color:#fff1d7;box-shadow:0 4px 0 #462733,inset 0 1px 0 #f5c699;min-height:49px;font-size:13px;font-weight:800;text-shadow:0 1px 2px #482126}
.homeBtn small{font-size:10px;display:block;font-weight:400;opacity:.85;margin-top:3px}
.homeFoot{text-align:center;color:#ffe7c4;font-size:10px;text-shadow:0 2px 4px #1d1215}
#app.game-shell{background:linear-gradient(180deg,#483035,#2c2027);}
#app.game-shell .panel{border:2px solid #b7835f;box-shadow:inset 0 1px #eccb8640,0 2px 0 #23191c}
#app.game-shell .space{border:2px solid #bb8d60;box-shadow:inset 0 0 0 2px #eebd6240,0 2px 0 #23181b}
#app.game-shell .shelf{background:linear-gradient(180deg,#5e3833,#39272b)}
#app.game-shell .main .canvas{background:linear-gradient(180deg,#3c2930 0%,#604037 71%,#aa7048 73%,#c58b55 100%);border-color:#d7aa71}
#app.game-shell button:not(:disabled):active,.homeBtn:active,.homePrimary:active{transform:translateY(2px) scale(.975);filter:brightness(1.12)}
button{transition:transform .11s ease,filter .13s ease,box-shadow .16s ease}
#app.game-shell .tile:active,#app.game-shell .ingredient:active{transform:scale(.94);filter:brightness(1.22)}
#app.game-shell .customer.active{box-shadow:0 0 0 1px #ffe5a0,0 0 14px #f5c76b77}
#app.game-shell .customer .face{display:inline-block;animation:gentleBob 3.3s ease-in-out infinite alternate}
#app.game-shell .customer:nth-child(even) .face{animation-delay:-1.6s}
#app.game-shell .glass{filter:drop-shadow(0 4px 4px #1b131b77)}
#app.game-shell .pouring .bottleMain{transform:rotate(-9deg) translateY(-2px);filter:drop-shadow(0 0 4px #ffd18b)}
#app.game-shell .bottleMain{transform-origin:70% 90%;transition:transform .2s ease}
#app.game-shell .pouring .canvas:after{content:'';height:72px;width:5px;border-radius:6px;position:absolute;top:7px;left:50%;transform:translateX(-50%) rotate(-5deg);background:repeating-linear-gradient(180deg,#ffe09f,#f2af4c 8px,#faf0bf 13px);opacity:.82;z-index:8;pointer-events:none;animation:liquidPour .4s linear infinite}
#app.game-shell .pouring .floatingIngredient{animation:none}
#app.game-shell .tile .emoji{filter:drop-shadow(1px 2px 0 #241719)}
#app.game-shell .ingredient span{display:inline-block;transition:transform .2s}
#app.game-shell .ingredient:active span{transform:translateY(-4px) rotate(-12deg)}
#app.game-shell .candyBowl{animation:gentleBob 2.6s ease-in-out infinite alternate}
.modal{animation:modalRise .2s ease-out both;max-height:min(86dvh,760px);overflow-y:auto}
.modalCloseX{font-size:22px!important}
.overlay.visible{backdrop-filter:blur(3px)}
.settingsRow{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #80665d;padding:12px 0;font-size:14px}
.settingsRow button{border:1px solid #b88b67;border-radius:9px;padding:7px 13px;background:#72504a}
.settingsRow input{width:45%;accent-color:#efb75e}
.settingsHelp{font-size:11px;color:#dbc4b4;line-height:1.7}
@keyframes twinkle{to{opacity:.3;transform:scale(.8)}}
@keyframes gentleBob{to{transform:translateY(-3px)}}
@keyframes liquidPour{to{background-position:0 20px;opacity:.6}}
@keyframes modalRise{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:380px){.homeStage{padding-left:9px;padding-right:9px;gap:6px}.homeStats{gap:5px}.pixelCard{font-size:11px;padding:8px 4px}.homeTitle{letter-spacing:0}.homeBtn{font-size:12px;min-height:46px}.dayPanel{padding:8px}}
@media(max-height:710px){.homeStage{grid-template-rows:auto auto auto minmax(110px,1fr) auto auto auto}.homePrimary{padding:10px;min-height:57px}.homeBtn{min-height:42px}}
.low-motion *{animation-duration:.01ms!important;transition-duration:.01ms!important}@media(prefers-reduced-motion:reduce){.homeTitle:before,.homeTitle:after,.homeSpark,.customer .face,.candyBowl{animation:none!important}}

/* V1.1: first pass of unified sprite-like beverage art, effects and fluid interaction */
#app.game-shell .shelf .tile{background:linear-gradient(165deg,#6c4840,#3b2929);border-color:#ad7b58;box-shadow:inset 0 1px #e5b7854d,0 2px #281d20}
#app.game-shell .tile .emoji{height:38px;display:grid;place-items:center;position:relative}
.pixelBottle{width:29px;min-width:29px;filter:drop-shadow(2px 3px 0 #291c1e)}
.pixelBottleNeck{display:block;position:absolute;top:0;left:10px;width:10px;height:10px;background:#5e3124;border:2px solid #f3a66c;box-shadow:inset 0 2px #cc8a50}
.pixelBottleBody{position:absolute;bottom:1px;left:2px;width:25px;height:30px;background:linear-gradient(90deg,#ffffff40 0%,transparent 23%,var(--bottle-color) 25%,var(--bottle-color) 80%,#0006);border:3px solid #2e2026;box-shadow:inset 2px 2px #ffffff73,2px 0 #c68f56;border-radius:3px 3px 5px 5px;image-rendering:pixelated}
.pixelBottleBody:before{content:'';position:absolute;inset:5px 2px 5px;background:#f8e6bc;border:1px solid #a77852}
.pixelBottleBody b{position:absolute;inset:10px 7px 9px;background:#c58539;z-index:2;border-radius:1px}
.tinyBottle{display:inline-flex;width:21px;height:26px;position:relative;background:linear-gradient(90deg,#f6e6b7,var(--bottle-color) 30%,#30212a 100%);border:3px solid #3b2428;border-radius:4px 4px 6px 6px;color:#f9e4ab!important;font-size:12px!important;align-items:center;justify-content:center;vertical-align:middle;filter:drop-shadow(2px 2px 0 #23191b)}
.tinyBottle:before{content:'';position:absolute;top:-8px;left:4px;width:7px;height:7px;border:2px solid #4b302c;background:#b17747}

function startPour(){

function calculateRating(r,c){let isSoft=r.id>=0&&r.id<=3;let target=Object.entries(r.parts).map(([id,v])=>[id,isSoft?Math.max(0,200-iceSpace()):v]);let intended=target.reduce((s,[id,v])=>s+v,0);let diff=target.reduce((s,[id,v])=>s+Math.abs((glass.parts[id]||0)-v),0);for(let [id,v]of Object.entries(glass.parts))if(r.parts[id]===undefined)diff+=v;let err=diff/Math.max(1,intended)*100;let desiredIce=c?.special?.ice??r.ice;if(!isSoft||c?.special?.ice!=null)err+=Math.abs((glass.extras.ice||0)-desiredIce)*10;if(c?.special?.lemon)err+=Math.abs((glass.extras.lemon||0)-c.special.lemon)*10;if(r.tool&&r.tool!==glass.tool)err+=10;const recommended=r.kind==='beer'?2:r.id===7||r.id===8||r.id===9?5:r.id===5||r.id===6?3:0;let idx=GLASSES.findIndex(g=>g[0]===glass.name);if(idx!==recommended)err+=15;if(r.kind==='beer'){const foamPercent=(glass.foam||0)*100;if(foamPercent>30)err+=Math.min(40,(foamPercent-30)*2)}if(glass.overflow)err+=Math.min(40,glass.overflow/Math.max(1,intended)*100);err=Math.min(100,err);let stars=err<=10?5:err<=20?4:err<=30?3:err<=40?2:1;return {err,stars}}
function deliver(i){if(!glass){showToast('先制作饮品');return}let c=session.customers[i];if(!c){showToast('这里没有顾客');return}if(!Object.keys(glass.parts).length){showToast('这还是空杯');return}stopPour();stopBeer();let r=R[c.recipe],result=calculateRating(r,c),stars=result.stars,paid=money(r.price*([0,.4,.6,.8,1,1][stars])),tip=stars===5?money(r.price*.2):stars===4?money(r.price*Math.random()*.2):0;let decorBonus=0;if(stars>=4&&glass.decor&&Object.values(glass.decor).some(Boolean)&&Math.random()<.20){decorBonus=money(r.price*.10);tip+=decorBonus;}glass=null;session.done++;session.income+=paid;session.tip+=tip;state.coins+=paid+tip;sfx('tip');session.ratings.push({name:c.name,recipe:r.name,stars,finalStars:stars,paid,tip,decorBonus,err:result.err});let record=session.ratings[session.ratings.length-1];persist();session.customers[i]=null;fillSeat(i);selectedSeat=session.customers.findIndex(x=>x);if(selectedSeat<0)selectedSeat=0;renderGame();const compensation=stars<=2;modalOpen(`<h2>${'★'.repeat(stars)}${'☆'.repeat(5-stars)} · 顾客评价</h2><p><b>${c.name}</b>：${r.name}</p><div class="row"><span>配方综合误差</span><b>${result.err.toFixed(1)}%</b></div><div class="row"><span>实收饮品金额</span><b>${paid}金币</b></div><div class="row"><span>小费</span><b>${tip}金币 ${decorBonus?'（含装饰惊喜+'+decorBonus+'）':''}</b></div>${compensation?'<p>顾客对饮品不满意。你可以选择免单协商改善评价，但有失败概率。</p>':''}<div class="actions">${compensation?'<button class="btn" id="free">免单协商</button>':''}<button class="btn yellow" id="accept">${compensation?'正常收费':'继续接待'}</button></div>`);$('accept').onclick=()=>{finalizeRating(record,false);modalClose();if(session.done>=session.total)finishDay()};if(compensation)$('free').onclick=()=>{session.income-=record.paid;state.coins-=record.paid;record.paid=0;let chance={随和:.85,普通:.7,理性:.65,挑剔:.5,急性子:.55}[c.personality]||.7;let ok=Math.random()<chance;record.finalStars=ok?Math.min(5,record.stars+1+Math.floor(Math.random()*3)):record.stars;record.compensated=true;modalOpen(`<h2>${ok?'协商成功':'协商失败'}</h2><p>本次饮品已免单，
